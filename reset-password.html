<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Reset password | HapIsabela</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/vacancies.css" />
  <link rel="stylesheet" href="/assets/css/green-theme.css" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <script src="/config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="/assets/js/password.js"></script>
</head>
<body data-password-page>
  <main class="password-recovery">
    <a href="/" class="text-button">← Back to HapIsabela</a>
    <section class="panel form-panel">
      <h1>Reset password</h1>
      <p id="recoveryIntro">Request a reset link or open the link from your email to choose a new password.</p>
      <form id="passwordForm" class="hidden">
        <label>New password<input name="new_password" type="password" autocomplete="new-password" minlength="8" required /></label>
        <label>Confirm new password<input name="confirm_password" type="password" autocomplete="new-password" minlength="8" required /></label>
        <p class="muted">Use at least 8 characters.</p>
        <button type="submit" class="btn">Update password</button>
      </form>
      <form id="requestResetForm">
        <label>Email address<input name="email" type="email" autocomplete="email" required /></label>
        <button type="submit" class="btn">Send reset link</button>
      </form>
      <p id="passwordStatus" role="status" aria-live="polite"></p>
      <a id="passwordDone" class="btn hidden" href="/">Return to the portal</a>
    </section>
  </main>
</body>
</html>
