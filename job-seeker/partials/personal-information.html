<section id="panel-personal" role="tabpanel" aria-labelledby="tab-personal" ><h2>Personal details</h2><p>Keep your contact information current.</p><div class="form-grid">
    <label>Full name *<input name="full_name" type="text" maxlength="120" required  /></label>
    <label>Phone number<input name="phone" type="tel" maxlength="50"   /></label>
    <label>Location<input name="location" type="text" maxlength="120"   /></label>
    <label>Date of birth<input name="personal.birth_date" type="date"    /></label>
    <label>Nationality<input name="personal.nationality" type="text" maxlength="120"   /></label>
    <label>Civil status<select name="personal.civil_status"><option value="">Select an option</option><option>Single</option><option>Married</option><option>Widowed</option><option>Separated</option><option>Other</option></select></label>
</div><label>Professional summary<textarea name="bio" rows="4" maxlength="2000"></textarea></label></section>
