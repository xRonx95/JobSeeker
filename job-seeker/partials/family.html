<section id="panel-family" role="tabpanel" aria-labelledby="tab-family" hidden><h2>Family information</h2><p>Provide only the details you want to keep in your personal record.</p><div class="form-grid">
    <label>Parent / Guardian name<input name="family.guardian_name" type="text" maxlength="120"   /></label>
    <label>Spouse / Partner name<input name="family.partner_name" type="text" maxlength="120"   /></label>
    <label>Number of dependants<input name="family.dependants" type="number"   min="0" max="99" /></label>
    <label>Emergency contact name<input name="family.emergency_name" type="text" maxlength="120"   /></label>
    <label>Relationship<input name="family.emergency_relationship" type="text" maxlength="80"   /></label>
    <label>Emergency contact phone<input name="family.emergency_phone" type="tel" maxlength="50"   /></label>
</div></section>
