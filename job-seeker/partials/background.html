<section id="panel-background" role="tabpanel" aria-labelledby="tab-background" hidden><h2>Professional background</h2><p>Record your experience, skills, and availability.</p><div class="form-grid">
    <label>Most recent position<input name="background.recent_position" type="text" maxlength="180"   /></label>
    <label>Most recent employer<input name="background.recent_employer" type="text" maxlength="180"   /></label>
    <label>Years of experience<input name="background.experience_years" type="number"   min="0" max="80" step="0.5" /></label>
    <label>Availability<select name="background.availability"><option value="">Select an option</option><option>Immediately</option><option>Within two weeks</option><option>Within one month</option><option>By arrangement</option></select></label>
    <label>Languages<input name="background.languages" type="text" maxlength="180"   /></label>
</div><label>Skills<textarea name="background.skills" rows="4" maxlength="2000"></textarea></label>
<label>Experience summary<textarea name="background.experience_summary" rows="4" maxlength="2000"></textarea></label></section>
